name: Selftests regression gate

on:
  pull_request:
    paths:
      - 'build.sh'
      - 'uml-test-progs'
      - 'patches/**'
      - 'scripts/**'
      - 'corpus_manifest.json'
      - 'bpf-next-commit'
      - 'reports/selftests-baseline/**'
      - '.github/workflows/selftests-gate.yml'
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: selftests-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Full test_progs sweep vs baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ccache
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ccache

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          # Exact-key hits never happen twice (run_id suffix) so every run
          # SAVES its warmed cache; restore falls back to the newest cache
          # for the same pin/patches, then to any older gate cache.
          key: gate-ccache-${{ hashFiles('bpf-next-commit', 'patches/**') }}-${{ github.run_id }}
          restore-keys: |
            gate-ccache-${{ hashFiles('bpf-next-commit', 'patches/**') }}-
            gate-ccache-

      - name: Build UML kernel and selftests
        env:
          DEBIAN_FRONTEND: noninteractive
          GITHUB_TOKEN: ${{ github.token }}
          UML_BUILD_CCACHE: 1
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 3G
          # The prebuilt LLVM is re-extracted every run, so the default
          # mtime-based compiler identity would never match; hash content.
          CCACHE_COMPILERCHECK: content
        run: ./build.sh

      - name: ccache stats
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: ccache -s

      - name: Run gate (full sweep + baseline compare)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/selftests_gate.py --jobs 3 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload sweep logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftests-gate-logs-${{ github.sha }}
          path: .build/test-logs/
          if-no-files-found: warn
          retention-days: 14
